[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-invoice"
version = "0.1.0"
description = "发票小助手：飞书机器人与 Web 发票管理"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "lark-oapi>=1.4,<2",
    "python-dotenv>=1,<2",
    "alibabacloud-ocr-api20210707>=3,<4",
    "PyMuPDF>=1.24,<2",
    "reportlab>=4,<5",
    "python-multipart>=0.0.20,<1",
    "itsdangerous>=2,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
